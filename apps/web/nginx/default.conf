# Servidor da Home: os arquivos do export estático do Next, na porta 8080, como UID 101.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    # Atrás do proxy, um redirecionamento absoluto levaria a porta 8080 ao Visitante.
    absolute_redirect off;
    charset utf-8;

    # Respostas de texto comprimidas; o text/html já entra por padrão.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/css text/javascript application/javascript application/json text/plain text/xml application/xml image/svg+xml application/manifest+json;

    # Os cabeçalhos de segurança vão em toda resposta, inclusive a 404;
    # os blocos `location` somam o seu `Cache-Control` a eles.
    add_header_inherit merge;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;

    # O que tem hash no nome nunca muda: cache longo e imutável.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # O resto (HTML, version.json, robots.txt, sitemap.xml e ícones) revalida a cada visita.
    # Nunca `no-transform`: com ele, a Cloudflare não injeta o script do Web Analytics.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache" always;
    }
}
