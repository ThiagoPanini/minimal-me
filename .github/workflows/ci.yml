# A validação de todo PR e da `main` (seção "Esteira" da #57). O resultado vira o check `gate`.
# No PR, a imagem é construída e testada sem push. Na `main`, ela é construída uma vez, vai ao
# GHCR como `sha-<commit>`, com proveniência, SBOM e atestado, e o e2e roda contra esse digest.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

# Nos PRs, uma rodada nova cancela a anterior do mesmo PR. Na `main`, cada commit tem o próprio
# grupo, e nada é cancelado.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/thiagopanini/minimal-me/web
  PR_IMAGE: minimal-me-web:pr

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
      - name: Instala o pnpm fixado em packageManager
        run: npm install --global "$(node -p "require('./package.json').packageManager")"
      - name: Instala as dependências
        run: pnpm install --frozen-lockfile
      - name: Roda o pnpm check
        run: pnpm check

  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      # Só os passos da `main` usam estas três: o push ao GHCR e o atestado.
      packages: write
      id-token: write
      attestations: write
    outputs:
      # A imagem que o e2e testa: no PR, a carregada do artefato; na `main`, o digest publicado.
      ref: ${{ github.event_name == 'push' && format('{0}@{1}', env.IMAGE, steps.publish.outputs.digest) || env.PR_IMAGE }}
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # PR: a imagem vai para um arquivo e segue ao e2e como artefato, sem push. O cache só é lido.
      - name: Constrói a imagem do PR
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/web/Dockerfile
          build-args: COMMIT=${{ github.sha }}
          tags: ${{ env.PR_IMAGE }}
          outputs: type=docker,dest=${{ runner.temp }}/web-image.tar
          provenance: false
          sbom: false
          cache-from: type=gha,scope=web
      - name: Entrega a imagem do PR ao e2e
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-image
          path: ${{ runner.temp }}/web-image.tar
          if-no-files-found: error
          retention-days: 1

      # `main`: construída uma vez e publicada; só a `main` escreve o cache.
      - name: Entra no GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Constrói e publica a imagem
        id: publish
        if: github.event_name == 'push'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/web/Dockerfile
          build-args: COMMIT=${{ github.sha }}
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          push: true
          provenance: mode=max
          # Com o ARG BUILDKIT_SBOM_SCAN_STAGE do Dockerfile, a SBOM cobre o estágio de build.
          sbom: true
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
      - name: Atesta o digest publicado
        if: github.event_name == 'push'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
          # Registro de armazenamento só existe para repositório de organização.
          create-storage-record: false

  e2e:
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Recebe a imagem do PR
        if: github.event_name == 'pull_request'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-image
          path: ${{ runner.temp }}
      - name: Carrega a imagem do PR
        if: github.event_name == 'pull_request'
        run: docker load --input "$RUNNER_TEMP/web-image.tar"
      # O login sai antes da instalação, para o código das dependências não ver a credencial.
      - name: Baixa a imagem publicada pelo digest
        if: github.event_name == 'push'
        env:
          WEB_IMAGE: ${{ needs.image.outputs.ref }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker pull "$WEB_IMAGE"
          docker logout ghcr.io

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
      - name: Instala o pnpm fixado em packageManager
        run: npm install --global "$(node -p "require('./package.json').packageManager")"
      - name: Instala as dependências
        run: pnpm install --frozen-lockfile
      - name: Testa a imagem com o Playwright
        env:
          WEB_IMAGE: ${{ needs.image.outputs.ref }}
        run: pnpm test:e2e
      - name: Guarda traces e capturas das falhas
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results
          path: apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 7

  # O check obrigatório. Roda sempre e só passa com `success` em todos os jobs da validação:
  # falha, pulo ou cancelamento de qualquer um o deixa vermelho.
  gate:
    if: always()
    needs: [quality, image, e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Exige success de todos os jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          if ! jq -e 'length > 0 and all(.[]; .result == "success")' <<<"$NEEDS" >/dev/null; then
            echo "::error::O gate só passa com success em todos os jobs da validação."
            exit 1
          fi
