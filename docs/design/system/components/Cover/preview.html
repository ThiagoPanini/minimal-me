<!-- @dsCard height=288 -->
<style>
  body{margin:0;background:var(--ground,#161616)}
  .cover{position:relative;width:960px;height:288px;overflow:hidden;background:var(--ground,#161616)}
  .cover svg{position:absolute;inset:0;display:block}
  .b-sky{fill:var(--sky,#F3F3F2)}
  .b-hairline{fill:var(--hairline,#3A3A37)}
  .b-mist{fill:var(--mist,#8E8E89)}
  .b-light{fill:var(--light,#E9E9E6)}
  .orb{fill:none;stroke:var(--ink,#141414);stroke-width:1}
  .planet{fill:var(--ink,#141414)}
  .words{position:absolute;left:40px;bottom:40px;max-width:440px}
  .name{margin:0;font:300 64px/.95 var(--font-sans,"Jost",sans-serif);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;color:var(--light,#E9E9E6)}
  .tag{margin:18px 0 0;font:300 13px/1.5 var(--font-mono,"IBM Plex Mono",monospace);color:var(--mist,#8E8E89)}
</style>
<div class="cover">
  <!--
    blocks: sky 352×288 (the one light surface) · hairline 96×144 · mist 96×72 · light 96×72
    arrangement: one tall slab bleeding off the top, right and bottom edges, with a strip of three unequal bands on its left; everything right of x = 480
    pattern: the literal motif row. The home opens on a figure watching a celestial map and the mark is a ringed point, so three thin orbits, four planets and the mark are drawn in ink on the sky slab
    scales: band width 96 = 3 × rhythm-32; band heights 144 and 72 = 2 × and 1 × gutter-max; corners square; planets and mark use circle; orbits at 1px, the weight of a hairline
  -->
  <svg viewBox="0 0 960 288" width="960" height="288" aria-hidden="true">
    <defs><clipPath id="sky"><rect x="608" y="0" width="352" height="288"></rect></clipPath></defs>
    <rect class="b-hairline" x="512" y="0" width="96" height="144"></rect>
    <rect class="b-mist" x="512" y="144" width="96" height="72"></rect>
    <rect class="b-light" x="512" y="216" width="96" height="72"></rect>
    <rect class="b-sky" x="608" y="0" width="352" height="288"></rect>
    <g clip-path="url(#sky)">
      <g transform="rotate(-16 760 150)">
        <ellipse class="orb" cx="760" cy="150" rx="86" ry="30"></ellipse>
        <ellipse class="orb" cx="760" cy="150" rx="150" ry="56"></ellipse>
        <ellipse class="orb" cx="760" cy="150" rx="220" ry="86"></ellipse>
      </g>
      <circle class="planet" cx="726" cy="187" r="4"></circle>
      <circle class="planet" cx="619" cy="170" r="5"></circle>
      <circle class="planet" cx="880" cy="153" r="6"></circle>
      <circle class="planet" cx="845" cy="48" r="4"></circle>
      <circle class="orb" cx="760" cy="150" r="13"></circle>
      <circle class="planet" cx="760" cy="150" r="5"></circle>
    </g>
  </svg>
  <div class="words">
    <p class="name">Minimal Me</p>
    <p class="tag">hub pessoal e minimalista</p>
  </div>
</div>
