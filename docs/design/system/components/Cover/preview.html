<!-- @dsCard height=288 -->
<style>
  body{margin:0;background:var(--chao,#161616)}
  .cover{position:relative;width:960px;height:288px;overflow:hidden;background:var(--chao,#161616)}
  .cover svg{position:absolute;inset:0;display:block}
  .b-ceu{fill:var(--ceu,#F3F3F2)}
  .b-fio{fill:var(--fio,#3A3A37)}
  .b-nevoa{fill:var(--nevoa,#8E8E89)}
  .b-luz{fill:var(--luz,#E9E9E6)}
  .orb{fill:none;stroke:var(--tinta,#141414);stroke-width:1}
  .astro{fill:var(--tinta,#141414)}
  .words{position:absolute;left:40px;bottom:40px;max-width:440px}
  .name{margin:0;font:300 64px/.95 var(--font-sans,"Jost",sans-serif);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;color:var(--luz,#E9E9E6)}
  .tag{margin:18px 0 0;font:300 13px/1.5 var(--font-mono,"IBM Plex Mono",monospace);color:var(--nevoa,#8E8E89)}
</style>
<div class="cover">
  <!--
    blocks: ceu 352×288 (the sky, the one light surface) · fio 96×144 · nevoa 96×72 · luz 96×72
    arrangement: one tall slab bleeding off the top, right and bottom edges, with a strip of three unequal bands on its left; everything right of x = 480
    pattern: the literal motif row. The home opens on a figure watching a celestial map and the mark is a ringed point, so three hairline orbits, four bodies and the mark are drawn in tinta on the ceu slab
    scales: band width 96 = 3 × ritmo-32; band heights 144 and 72 = 2 × and 1 × calha-max; corners reto; bodies and mark use circulo; orbits at 1px, the weight of fio
  -->
  <svg viewBox="0 0 960 288" width="960" height="288" aria-hidden="true">
    <defs><clipPath id="sky"><rect x="608" y="0" width="352" height="288"></rect></clipPath></defs>
    <rect class="b-fio" x="512" y="0" width="96" height="144"></rect>
    <rect class="b-nevoa" x="512" y="144" width="96" height="72"></rect>
    <rect class="b-luz" x="512" y="216" width="96" height="72"></rect>
    <rect class="b-ceu" x="608" y="0" width="352" height="288"></rect>
    <g clip-path="url(#sky)">
      <g transform="rotate(-16 760 150)">
        <ellipse class="orb" cx="760" cy="150" rx="86" ry="30"></ellipse>
        <ellipse class="orb" cx="760" cy="150" rx="150" ry="56"></ellipse>
        <ellipse class="orb" cx="760" cy="150" rx="220" ry="86"></ellipse>
      </g>
      <circle class="astro" cx="726" cy="187" r="4"></circle>
      <circle class="astro" cx="619" cy="170" r="5"></circle>
      <circle class="astro" cx="880" cy="153" r="6"></circle>
      <circle class="astro" cx="845" cy="48" r="4"></circle>
      <circle class="orb" cx="760" cy="150" r="13"></circle>
      <circle class="astro" cx="760" cy="150" r="5"></circle>
    </g>
  </svg>
  <div class="words">
    <p class="name">Minimal Me</p>
    <p class="tag">hub pessoal e minimalista</p>
  </div>
</div>
