<!-- @dsCard group="Frentes" height=120 subtitle="Ponto cheio: em desenvolvimento. Ponto vazado: em planejamento." -->
<style>
  body{margin:0;background:var(--chao,#161616)}
  .strip{position:relative;height:120px;display:flex;align-items:center;justify-content:center;gap:20px;overflow:hidden}
  .strip::before{content:"";position:absolute;inset:0;background:url(/_blob/d0057303614305c5fdf66d8706fa0b63) 50% 44%/cover;filter:brightness(.8) contrast(.9)}
  .badge{position:relative;display:inline-flex;align-items:center;gap:7px;padding:6px 9px 6px 8px;border:1px solid var(--selo-borda,rgba(233,233,230,.14));background:var(--selo-fundo,rgba(14,14,15,.42));-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);font:400 10px/1 var(--font-mono,"IBM Plex Mono",monospace);letter-spacing:.05em;color:var(--selo-texto,rgba(233,233,230,.8));white-space:nowrap}
  .badge i{flex:none;width:5px;height:5px;border-radius:50%;background:currentColor}
  .badge.dev i{animation:pulse 2.6s var(--ease-io,ease-in-out) infinite}
  .badge.plan{color:rgba(233,233,230,.56);border-color:rgba(233,233,230,.1)}
  .badge.plan i{background:none;box-shadow:inset 0 0 0 1px currentColor}
  @keyframes pulse{0%,100%{opacity:.28}50%{opacity:1}}
  @media (prefers-reduced-motion:reduce){.badge.dev i{animation:none}}
</style>
<div class="strip">
  <span class="badge dev"><i></i>Em desenvolvimento</span>
  <span class="badge plan"><i></i>Em planejamento</span>
</div>
