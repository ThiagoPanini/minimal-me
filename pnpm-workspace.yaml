packages:
  - apps/*

# Os padrões do pnpm 12 já valem: um dia de maturidade, strictDepBuilds e blockExoticSubdeps.
trustPolicy: no-downgrade
# Só o lefthook roda script de instalação: o postinstall dele instala os ganchos do git.
allowBuilds:
  lefthook: true

overrides:
  # O Lighthouse do teste de peso e LCP. O puppeteer-core 25.13 em diante pede o chromium-bidi
  # 157.0.8090-0, publicado sem a proveniência das versões anteriores, e o trustPolicy o recusa.
  # O 25.12.0 cabe na faixa que o Lighthouse 13.5 declara (daí o `~13.5.0` da web) e pede o
  # chromium-bidi 17.0.2, com proveniência. Sai quando um puppeteer-core novo voltar a pedir
  # um chromium-bidi com proveniência.
  "lighthouse>puppeteer-core": 25.12.0
  # O chromium-bidi 17.0.2 declara o zod 3, e todo zod abaixo do 4.6.6 tem a GHSA-mrhx-c7xc-m3w5
  # (alta). O 4.6.7 tem proveniência. O Puppeteer só carrega o chromium-bidi no WebDriver BiDi, e
  # o Lighthouse fala CDP, então o zod nem roda no teste. Sai junto com a linha de cima.
  "chromium-bidi>zod": 4.6.7
